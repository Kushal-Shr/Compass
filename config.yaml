# Every time in this file is wall-clock time in this zone. Times must be quoted: "08:00".
timezone: America/Chicago

day_window:
  start: "08:00"
  end: "23:00"

# Protected time is never used for study blocks.
protected:
  - {title: Dinner, start: "18:00", end: "19:00", days: [mon, tue, wed, thu, fri, sat, sun]}
  - {title: Time with girlfriend, start: "19:00", end: "21:00", days: [fri, sat]}

planner:
  min_block_minutes: 25
  max_block_minutes: 90
  break_minutes: 10
  daily_cap_minutes: 360

calendars:
  - primary

models:
  writer: claude-sonnet-5-5
